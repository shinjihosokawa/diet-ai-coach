<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>レジ計算機</title>
  <meta name="description" content="店舗の締め作業用レジ計算機 - 現金の枚数を入力して合計金額を自動計算">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="レジ計算機">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <style>
    :root {
      --bg-black: #000000;
      --display-bg: #1c1c1e;
      --row-active: #2c2c2e;
      --text-white: #ffffff;
      --text-gray: #8e8e93;
      --text-orange: #ff9f0a;
      --btn-num: #333333;
      --btn-num-active: #555555;
      --btn-fn: #a5a5a5;
      --btn-fn-active: #d4d4d2;
      --btn-fn-text: #000000;
      --btn-orange: #ff9f0a;
      --btn-orange-active: #fcc875;
      --btn-danger: #3a1515;
      --btn-danger-text: #ff453a;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-black);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Hiragino Sans", Meiryo, sans-serif;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: var(--bg-black);
    }

    /* ========================================
       1. 合計金額 ディスプレイ (電卓の画面風)
    ======================================== */
    .total-display {
      flex-shrink: 0;
      padding: 12px 16px 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-black);
    }

    .total-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-gray);
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .total-value-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
      width: 100%;
      justify-content: flex-end;
    }

    .total-number {
      font-size: 2.2rem;
      font-weight: 300;
      color: var(--text-white);
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      white-space: nowrap;
    }

    .total-unit {
      font-size: 1.1rem;
      font-weight: 400;
      color: var(--text-orange);
      white-space: nowrap;
    }

    /* ========================================
       2. 金種リスト (スクロール不要・画面フィット)
    ======================================== */
    .denom-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 4px 10px;
      gap: 2px;
      min-height: 0;
      overflow: hidden;
    }

    .denom-row {
      flex: 1;
      display: grid;
      grid-template-columns: 72px 1fr 115px;
      align-items: center;
      padding: 0 12px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      min-height: 0;
      border: 1px solid transparent;
    }

    .denom-row.active {
      background: var(--row-active);
      border-color: #3a3a3c;
    }

    .denom-label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-gray);
      white-space: nowrap;
    }

    .denom-row.active .denom-label {
      color: var(--text-white);
    }

    .denom-count-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }

    .denom-count {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-white);
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    .denom-row.active .denom-count {
      color: var(--text-orange);
    }

    .denom-unit {
      font-size: 0.75rem;
      color: var(--text-gray);
      line-height: 1;
      white-space: nowrap;
    }

    .denom-subtotal {
      font-size: 0.95rem;
      font-weight: 500;
      color: #636366;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      line-height: 1;
    }

    .denom-row.has-value .denom-subtotal {
      color: var(--text-white);
    }

    .denom-row.active .denom-subtotal {
      color: var(--text-orange);
    }

    /* ========================================
       3. テンキー (スマホ電卓完全再現)
    ======================================== */
    .keypad-container {
      flex-shrink: 0;
      padding: 6px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      background: var(--bg-black);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 420px;
      margin: 0 auto;
    }

    .btn {
      border: none;
      outline: none;
      border-radius: 50px;
      font-family: inherit;
      font-size: 1.5rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      aspect-ratio: 1.35;
      max-height: 58px;
    }

    /* 数字ボタン (ダークグレー) */
    .btn-num {
      background: var(--btn-num);
      color: var(--text-white);
    }
    .btn-num:active {
      background: var(--btn-num-active);
    }

    /* 上部機能ボタン (ライトグレー / 電卓AC風) */
    .btn-fn {
      background: var(--btn-fn);
      color: var(--btn-fn-text);
      font-size: 1.15rem;
      font-weight: 600;
    }
    .btn-fn:active {
      background: var(--btn-fn-active);
    }

    /* オレンジボタン (演算子・確定/次へ) */
    .btn-orange {
      background: var(--btn-orange);
      color: var(--text-white);
      font-size: 1.15rem;
      font-weight: 600;
    }
    .btn-orange:active {
      background: var(--btn-orange-active);
    }

    /* 0ボタン (横長) */
    .btn-span-2 {
      grid-column: span 2;
      aspect-ratio: auto;
      border-radius: 50px;
      padding-left: 24px;
      justify-content: flex-start;
    }

    /* 確定・次へボタン (2列スパン) */
    .btn-enter {
      grid-column: span 2;
      aspect-ratio: auto;
      border-radius: 50px;
      font-size: 1.1rem;
    }

    /* 危険ボタン (全消去) */
    .btn-danger {
      background: var(--btn-danger);
      color: var(--btn-danger-text);
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* ========================================
       レスポンシブ (画面の高さ調整)
    ======================================== */
    @media (min-height: 720px) {
      .total-number { font-size: 2.6rem; }
      .denom-label { font-size: 1.05rem; }
      .denom-count { font-size: 1.35rem; }
      .denom-subtotal { font-size: 1.05rem; }
      .btn { font-size: 1.6rem; max-height: 64px; }
      .keypad-grid { gap: 10px; }
    }

    @media (min-height: 800px) {
      .total-display { padding: 16px 20px 10px; }
      .total-number { font-size: 3rem; }
      .denom-list { padding: 6px 12px; gap: 4px; }
      .denom-row { padding: 0 14px; }
      .btn { max-height: 70px; font-size: 1.75rem; }
    }

    /* PC大画面用 (電卓サイズに固定) */
    .popout-btn {
      display: none;
    }

    @media (min-width: 600px) {
      body {
        background: #121214;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-container {
        width: 390px;
        height: 760px;
        max-height: 94vh;
        border-radius: 28px;
        border: 2px solid #2c2c2e;
        box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        overflow: hidden;
      }
      .popout-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        position: absolute;
        top: 16px;
        right: 16px;
        background: #2c2c2e;
        color: #8e8e93;
        border: 1px solid #3a3a3c;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
      }
      .popout-btn:hover {
        background: #3a3a3c;
        color: #ffffff;
      }
    }
  </style>
</head>
<body>

  <!-- PC用: 小窓で開くボタン -->
  <button class="popout-btn" onclick="openPopupWindow()" title="独立した電卓ウィンドウで開く">❐ 小窓で開く</button>

  <div class="app-container">
    <!-- 1. 合計金額 ディスプレイ -->
    <div class="total-display">
      <div class="total-label">合計金額</div>
      <div class="total-value-wrap">
        <span class="total-number" id="grandTotal">0</span>
        <span class="total-unit">円</span>
      </div>
    </div>

    <!-- 2. 金種リスト -->
    <div class="denom-list" id="denomList"></div>

    <!-- 3. 電卓風 テンキーパッド -->
    <div class="keypad-container">
      <div class="keypad-grid">
        <!-- 1行目: 機能キー -->
        <button class="btn btn-fn" onclick="pressClearCurrent()">C</button>
        <button class="btn btn-fn" onclick="pressBackspace()">⌫</button>
        <button class="btn btn-danger" onclick="pressResetAll()">全消去</button>
        <button class="btn btn-orange" onclick="pressPrev()">↑</button>

        <!-- 2行目: 7, 8, 9, ↓ -->
        <button class="btn btn-num" onclick="pressNum('7')">7</button>
        <button class="btn btn-num" onclick="pressNum('8')">8</button>
        <button class="btn btn-num" onclick="pressNum('9')">9</button>
        <button class="btn btn-orange" onclick="pressNext()">↓</button>

        <!-- 3行目: 4, 5, 6, 00 -->
        <button class="btn btn-num" onclick="pressNum('4')">4</button>
        <button class="btn btn-num" onclick="pressNum('5')">5</button>
        <button class="btn btn-num" onclick="pressNum('6')">6</button>
        <button class="btn btn-num" onclick="pressNum('00')">00</button>

        <!-- 4行目: 1, 2, 3, 0 -->
        <button class="btn btn-num" onclick="pressNum('1')">1</button>
        <button class="btn btn-num" onclick="pressNum('2')">2</button>
        <button class="btn btn-num" onclick="pressNum('3')">3</button>
        <button class="btn btn-num" onclick="pressNum('0')">0</button>

        <!-- 5行目: 確定 / 次へ (ワイドボタン) -->
        <button class="btn btn-orange btn-enter" style="grid-column: span 4;" onclick="pressNext()">確定 / 次へ ↵</button>
      </div>
    </div>
  </div>

  <script>
    const denominations = [
      { id: 'm10k', label: '1万円札', value: 10000 },
      { id: 'm5k',  label: '5千円札', value: 5000 },
      { id: 'm2k',  label: '2千円札', value: 2000 },
      { id: 'm1k',  label: '千円札',  value: 1000 },
      { id: 'c500', label: '500円玉', value: 500 },
      { id: 'c100', label: '100円玉', value: 100 },
      { id: 'c50',  label: '50円玉',  value: 50 },
      { id: 'c10',  label: '10円玉',  value: 10 },
      { id: 'c5',   label: '5円玉',   value: 5 },
      { id: 'c1',   label: '1円玉',   value: 1 }
    ];

    const counts = {};
    denominations.forEach(d => counts[d.id] = '');
    let activeIndex = 0;

    function init() {
      const list = document.getElementById('denomList');
      denominations.forEach((d, i) => {
        const row = document.createElement('div');
        row.className = 'denom-row' + (i === 0 ? ' active' : '');
        row.id = 'row-' + i;
        row.onclick = () => setActiveRow(i);
        row.innerHTML =
          '<div class="denom-label">' + d.label + '</div>' +
          '<div class="denom-count-wrap">' +
            '<span class="denom-count" id="count-' + d.id + '">0</span>' +
            '<span class="denom-unit">枚</span>' +
          '</div>' +
          '<div class="denom-subtotal" id="sub-' + d.id + '">0 円</div>';
        list.appendChild(row);
      });
      updateUI();
    }

    function setActiveRow(i) {
      if (i < 0 || i >= denominations.length) return;
      document.getElementById('row-' + activeIndex).classList.remove('active');
      activeIndex = i;
      document.getElementById('row-' + i).classList.add('active');
    }

    function pressNum(s) {
      const id = denominations[activeIndex].id;
      let cur = counts[id];
      if (cur === '' && (s === '0' || s === '00')) return;
      if ((cur + s).length > 4) return;
      counts[id] = cur + s;
      updateUI();
    }

    function pressBackspace() {
      const id = denominations[activeIndex].id;
      if (!counts[id].length) return;
      counts[id] = counts[id].slice(0, -1);
      updateUI();
    }

    function pressClearCurrent() {
      counts[denominations[activeIndex].id] = '';
      updateUI();
    }

    function pressResetAll() {
      if (confirm('すべての入力値をクリアしますか？')) {
        denominations.forEach(d => counts[d.id] = '');
        setActiveRow(0);
        updateUI();
      }
    }

    function pressNext() {
      if (activeIndex < denominations.length - 1) {
        setActiveRow(activeIndex + 1);
      }
    }

    function pressPrev() {
      if (activeIndex > 0) {
        setActiveRow(activeIndex - 1);
      }
    }

    function updateUI() {
      let total = 0;
      denominations.forEach((d, i) => {
        const n = counts[d.id] === '' ? 0 : parseInt(counts[d.id], 10);
        const sub = n * d.value;
        total += sub;
        document.getElementById('count-' + d.id).innerText = counts[d.id] || '0';
        document.getElementById('sub-' + d.id).innerText = sub.toLocaleString() + ' 円';
        const row = document.getElementById('row-' + i);
        row.classList.toggle('has-value', n > 0);
      });

      document.getElementById('grandTotal').innerText = total.toLocaleString();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') { e.preventDefault(); pressNum(e.key); }
      else if (e.key === 'Enter') { e.preventDefault(); pressNext(); }
      else if (e.key === 'Backspace') { e.preventDefault(); pressBackspace(); }
      else if (e.key === 'Escape') { e.preventDefault(); pressClearCurrent(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); pressNext(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); pressPrev(); }
      else if ((e.key === 'c' || e.key === 'C') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); pressClearCurrent(); }
    });

    function openPopupWindow() {
      const w = 410;
      const h = 780;
      const left = (window.screen.width - w) / 2;
      const top = (window.screen.height - h) / 2;
      window.open(window.location.href, 'regi_calc_win', `width=${w},height=${h},left=${left},top=${top},menubar=no,toolbar=no,location=no,status=no,resizable=yes`);
    }

    document.addEventListener('touchend', (e) => {
      if (e.target.closest('.btn')) e.preventDefault();
    }, { passive: false });

    // PWA Service Worker 登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }

    init();
  </script>
</body>
</html>
